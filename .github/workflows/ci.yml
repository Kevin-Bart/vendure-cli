name: Java CI with Maven & Format Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check code formatting (Google Java Format)
        uses: axel-op/googlejavaformat-action@v3
        with:
          args: "--replace" # Mettre "--dry-run" si on veut juste vérifier sans modifier

      - name: Build and Test with Maven
        run: mvn -B test